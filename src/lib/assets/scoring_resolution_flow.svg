<svg width="100%" viewBox="0 0 720 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Scoring and resolution flow</title>
  <desc>From a contest window closing through the two safety guards, scoring, XP award, wager settlement and the AI summary.</desc>
  <defs>
    <marker id="score-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5C6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="620" fill="#F5FAFA"/>

  <rect x="180" y="30" width="360" height="48" rx="12" fill="#FFFFFF" stroke="#E1E8E6"/>
  <text x="360" y="51" font-size="13" font-weight="800" fill="#1A2421" text-anchor="middle">Contest window elapses (endAt)</text>
  <text x="360" y="68" font-size="11" fill="#5C6B66" text-anchor="middle">picked up by the request-driven sweep, or the daily cron</text>
  <line x1="360" y1="78" x2="360" y2="100" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="180" y="102" width="360" height="52" rx="12" fill="#FFFFFF" stroke="#E87070"/>
  <text x="360" y="123" font-size="12.5" font-weight="800" fill="#B23A3A" text-anchor="middle">Guard 1 — refuse if now &lt; endAt</text>
  <text x="360" y="141" font-size="11" fill="#5C6B66" text-anchor="middle">409, so a result page load can never settle a running game</text>
  <line x1="360" y1="154" x2="360" y2="176" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="180" y="178" width="360" height="48" rx="12" fill="#FFFFFF" stroke="#E1E8E6"/>
  <text x="360" y="199" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">Fetch exit prices — one batch call</text>
  <text x="360" y="216" font-size="11" fill="#5C6B66" text-anchor="middle">same source the entry prices came from</text>
  <line x1="360" y1="226" x2="360" y2="248" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="180" y="250" width="360" height="52" rx="12" fill="#FFFFFF" stroke="#E87070"/>
  <text x="360" y="271" font-size="12.5" font-weight="800" fill="#B23A3A" text-anchor="middle">Guard 2 — refuse if any price is missing</text>
  <text x="360" y="289" font-size="11" fill="#5C6B66" text-anchor="middle">retries later; an outage never scores as "didn't move"</text>
  <line x1="360" y1="302" x2="360" y2="324" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="140" y="326" width="440" height="76" rx="12" fill="#FFFFFF" stroke="#E1E8E6"/>
  <text x="360" y="348" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">Score every pick</text>
  <text x="360" y="368" font-size="11.5" fill="#3B4A45" text-anchor="middle">move% = (exit − entry) ÷ entry × 100</text>
  <text x="360" y="387" font-size="11.5" fill="#3B4A45" text-anchor="middle">an active sector boost multiplies the <tspan font-weight="700">movement</tspan> ×1.25 — a loss too</text>
  <line x1="360" y1="402" x2="360" y2="424" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="180" y="426" width="360" height="48" rx="12" fill="#FFFFFF" stroke="#E1E8E6"/>
  <text x="360" y="447" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">Sum both lineups → set winner</text>
  <text x="360" y="464" font-size="11" fill="#5C6B66" text-anchor="middle">one score, computed once, read back everywhere</text>
  <line x1="360" y1="474" x2="360" y2="496" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>

  <rect x="40" y="498" width="200" height="82" rx="12" fill="#FFFFFF" stroke="#68C2A8"/>
  <text x="140" y="520" font-size="12" font-weight="800" fill="#1F7A63" text-anchor="middle">XP</text>
  <text x="140" y="540" font-size="11" fill="#3B4A45" text-anchor="middle">win 250 · loss 60</text>
  <text x="140" y="558" font-size="11" fill="#3B4A45" text-anchor="middle">×2 weekly</text>
  <text x="140" y="574" font-size="10.5" fill="#5C6B66" text-anchor="middle">Scrimmage XP kept separate</text>

  <rect x="260" y="498" width="200" height="82" rx="12" fill="#FFFFFF" stroke="#F78E79"/>
  <text x="360" y="520" font-size="12" font-weight="800" fill="#B04A32" text-anchor="middle">Wager settles</text>
  <text x="360" y="540" font-size="11" fill="#3B4A45" text-anchor="middle">pot to the winner</text>
  <text x="360" y="558" font-size="11" fill="#3B4A45" text-anchor="middle">refunded if there's no winner</text>
  <text x="360" y="574" font-size="10.5" fill="#5C6B66" text-anchor="middle">XP today, escrow later</text>

  <rect x="480" y="498" width="200" height="82" rx="12" fill="#1A2421"/>
  <text x="580" y="520" font-size="12" font-weight="800" fill="#F78E79" text-anchor="middle">Badges + AI summary</text>
  <text x="580" y="540" font-size="11" fill="#C2D0CB" text-anchor="middle">win badges awarded</text>
  <text x="580" y="558" font-size="11" fill="#C2D0CB" text-anchor="middle">breakdown via 0G Compute</text>
  <text x="580" y="574" font-size="10.5" fill="#9DAEA8" text-anchor="middle">on-chain badge is claimed, not pushed</text>

  <line x1="360" y1="496" x2="140" y2="496" stroke="#5C6B66" stroke-width="1.6"/>
  <line x1="360" y1="496" x2="580" y2="496" stroke="#5C6B66" stroke-width="1.6"/>
  <line x1="140" y1="496" x2="140" y2="498" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>
  <line x1="580" y1="496" x2="580" y2="498" stroke="#5C6B66" stroke-width="1.6" marker-end="url(#score-arrow)"/>
</svg>
