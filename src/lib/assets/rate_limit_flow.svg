<svg width="100%" viewBox="0 0 720 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Rate-limit strategy</title>
  <desc>How the per-token request fan-out was replaced by a single batch price call, and what is cached where.</desc>
  <defs>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5C6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="500" fill="#F5FAFA"/>

  <!-- before -->
  <rect x="40" y="38" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#E87070"/>
  <text x="58" y="62" font-size="11" font-weight="700" letter-spacing="1.6" fill="#B23A3A">BEFORE — ONE CALL PER TOKEN</text>
  <text x="58" y="88" font-size="12.5" fill="#3B4A45">30 parallel snapshot requests per refresh</text>
  <text x="58" y="110" font-size="12.5" fill="#3B4A45">rate-limited under real use</text>
  <text x="58" y="132" font-size="12.5" fill="#3B4A45">pool capped at 30 tokens by cost, not choice</text>
  <text x="58" y="154" font-size="12.5" fill="#3B4A45">a dropped call scored as "no movement"</text>
  <rect x="58" y="170" width="254" height="32" rx="8" fill="#FCE9E9"/>
  <text x="185" y="191" font-size="11.5" font-weight="700" fill="#B23A3A" text-anchor="middle">every Solana-ecosystem token locked out</text>

  <line x1="336" y1="128" x2="382" y2="128" stroke="#5C6B66" stroke-width="1.8" marker-end="url(#rl-arrow)"/>

  <!-- after -->
  <rect x="390" y="38" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#68C2A8"/>
  <text x="408" y="62" font-size="11" font-weight="700" letter-spacing="1.6" fill="#1F7A63">NOW — ONE BATCH CALL</text>
  <text x="408" y="88" font-size="12.5" fill="#3B4A45">Binance /ticker/24hr covers the whole market</text>
  <text x="408" y="110" font-size="12.5" fill="#3B4A45">price, 24h change and volume in one response</text>
  <text x="408" y="132" font-size="12.5" fill="#3B4A45">weight 80 of a 6,000/min budget</text>
  <text x="408" y="154" font-size="12.5" fill="#3B4A45">pool grew 30 → ~170 tokens</text>
  <rect x="408" y="170" width="254" height="32" rx="8" fill="#E6F5F0"/>
  <text x="535" y="191" font-size="11.5" font-weight="700" fill="#1F7A63" text-anchor="middle">same source for entry, live and exit prices</text>

  <!-- cached -->
  <rect x="40" y="246" width="640" height="212" rx="14" fill="#FFFFFF" stroke="#E1E8E6"/>
  <text x="58" y="270" font-size="11" font-weight="700" letter-spacing="1.6" fill="#B04A32">STILL CACHED SERVER-SIDE</text>

  <rect x="58" y="286" width="196" height="70" rx="10" fill="#EDF3F2"/>
  <text x="156" y="310" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">Sector spotlight</text>
  <text x="156" y="330" font-size="11.5" fill="#5C6B66" text-anchor="middle">SoSoValue · 5 min</text>
  <text x="156" y="347" font-size="11" fill="#5C6B66" text-anchor="middle">dashboard sector bars</text>

  <rect x="262" y="286" width="196" height="70" rx="10" fill="#EDF3F2"/>
  <text x="360" y="310" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">News feed</text>
  <text x="360" y="330" font-size="11.5" fill="#5C6B66" text-anchor="middle">SoSoValue · 15 min</text>
  <text x="360" y="347" font-size="11" fill="#5C6B66" text-anchor="middle">Knowledge Base · AI context</text>

  <rect x="466" y="286" width="196" height="70" rx="10" fill="#EDF3F2"/>
  <text x="564" y="310" font-size="12.5" font-weight="800" fill="#1A2421" text-anchor="middle">Token pool</text>
  <text x="564" y="330" font-size="11.5" fill="#5C6B66" text-anchor="middle">merged list · 2 min</text>
  <text x="564" y="347" font-size="11" fill="#5C6B66" text-anchor="middle">draft board</text>

  <rect x="58" y="370" width="604" height="70" rx="10" fill="#FDF3E3"/>
  <text x="78" y="394" font-size="12" font-weight="800" fill="#8A5B12">Known limit, stated plainly</text>
  <text x="78" y="414" font-size="11.5" fill="#3B4A45">The cache is in-process, so a serverless cold start empties it — the TTLs above are a ceiling, not a guarantee.</text>
  <text x="78" y="431" font-size="11.5" fill="#3B4A45">Live race sampling is throttled separately (6s) because each tick writes a row per token, not because the price call is costly.</text>
</svg>
